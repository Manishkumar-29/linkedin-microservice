spring:
  application:
    name: user-service

  datasource:
    url: <POSTGRESQL_URL>
    username: <POSTGRESQL_USERNAME>
    password: <POSTGRESQL_PASSWORD>
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9010
  servlet:
    context-path: /api/v1/users


jwt:
  secretKey: <JWT_SECRET_KEY>
