spring:
  application:
    name: posts-service

  datasource:
    url: <POSTGRESQL_URL>
    username: <POSTGRESQL_USERNAME>
    password: <POSTGRESQL_PASSWORD>
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

server:
  port: 9020
  servlet:
    context-path: /api/v1/posts
